services:
  - type: web
    name: globetrotter-api
    env: python
    buildCommand: bash ./build.sh
    startCommand: python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: GlobeTrotter <onboarding@resend.dev>
      - key: CLOUDINARY_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEOAPIFY_API_TIMEOUT
        value: "5"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
